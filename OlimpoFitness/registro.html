<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Olimpo Fitness</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header id="barra-navegacion"></header>
    <script src="scripts/barraNav.js"></script>


    <!-- Contenedor del Registro -->
    <div class="contenedor-login">
        <div class="cuadro-login">
            <h2>REGISTRAR CUENTA</h2>
            
            <form onsubmit="registrarCuenta(event)">
                <input type="email" id="reg-correo" class="campo-texto" placeholder="Ingrese su correo" required>
                <input type="text" id="reg-nombre" class="campo-texto" placeholder="Ingrese su nombre completo" required>
                <input type="password" id="reg-clave1" class="campo-texto" placeholder="Ingrese su contraseña" required>
                <input type="password" id="reg-clave2" class="campo-texto" placeholder="Confirme su contraseña" required>
                
                <button type="submit" class="boton-entrar">CREAR CUENTA</button> 

                <!-- Aquí se inyectarán los mensajes de error desde script.js -->
                <p class="texto-registro" id="mensaje-error" style="color: #ff4d4d; margin-top: 10px;"></p>
                
                <p class="texto-registro">
                    ¿Ya tienes cuenta? <a href="login.html" class="btn-crear">Iniciar sesión</a> 
                </p>
            </form>
        </div>
    </div>

       <script src="scripts/scriptRegistro.js"></script>
</body>
</html>
