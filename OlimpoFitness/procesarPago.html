<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Olimpo Fitness</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main>
    <header id="barra-navegacion"></header>
    <script src="scripts/barraNav.js"></script>

        <div class="contenedor-pago">
        <div class="cuadro-pago">
            <h2>CONFIRMAR PAGO</h2>
            
            <div class="fila-detalle">
                <span class="etiqueta">Beneficiario:</span>
                <span class="valor" id="nombre-beneficiario">asd</span> 
            </div>

            <div class="fila-detalle">
                <span class="etiqueta">Tipo de Plan:</span>
                <span class="valor" id="tipo-plan">asd</span> 
            </div>

            <div class="fila-detalle">
                <span class="etiqueta">Valor final:</span>
                <span class="valor" id="precio-plan">asd</span> 
            </div>

             <button id="btn-confirmar" class="boton-amarillo">PROCEDER AL PAGO</button>
        </div>
    </div>


    <script src="scripts/comprarPlanes.js"></script>
    <script src="scripts/scriptRegistro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</main>
</body>
</html>
