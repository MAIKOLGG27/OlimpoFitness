<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Olimpo Fitness</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav class="contenedor-botones">
        <img src="Imagenes/logo-blanco.png" alt="Logo gimnasio" class="logo">
        <a href="index.html" class="boton-texto">INICIO</a>
        <a href="planes.html" class="boton-texto">PLANES</a>
        <a href="nosotros.html" class="boton-texto">SOBRE NOSOTROS</a>
        <a href="perfil.html" class="boton-texto" style="color: #ffffff; text-decoration: underline;">MI PERFIL</a>
    </nav>

    <main class="contenedor-perfil">
        
        <div class="tarjeta-perfil">
            
            <div class="cabecera-perfil">
                <div class="avatar-usuario">
                    <span>OF</span>
                </div>
                <h1 class="nombre-usuario">Vicente Pérez</h1>
                <span class="badge-estado">Socio Activo</span>
            </div>

            <hr class="separador">

            <div class="seccion-datos">
                <h3 class="titulo-seccion">Datos Personales</h3>
                
                <div class="fila-dato">
                    <span class="etiqueta-dato">Correo:</span>
                    <span class="valor-dato">vicente.perez@duocuc.cl</span>
                </div>

                <div class="fila-dato">
                    <span class="etiqueta-dato">Teléfono:</span>
                    <span class="valor-dato">+56 9 1234 5678</span>
                </div>

                <div class="fila-dato">
                    <span class="etiqueta-dato">Sede Principal:</span>
                    <span class="valor-dato">Viña del Mar</span>
                </div>
            </div>

            <hr class="separador">

            <div class="seccion-datos">
                <h3 class="titulo-seccion">Membresía Actual</h3>
                
                <div class="fila-dato">
                    <span class="etiqueta-dato">Plan:</span>
                    <span class="valor-dato plan-resaltado">Plan Trimestral</span>
                </div>

                <div class="fila-dato">
                    <span class="etiqueta-dato">Estado:</span>
                    <span class="valor-dato estado-al-dia">Al día</span>
                </div>

                <div class="fila-dato">
                    <span class="etiqueta-dato">Vencimiento:</span>
                    <span class="valor-dato">15 de Noviembre, 2026</span>
                </div>
            </div>

            <div class="acciones-perfil">
                <a href="index.html" class="boton-accion secundario">Volver</a>
                <button class="boton-accion primario">Editar Datos</button>
            </div>

        </div>

    </main>

</body>
</html>
