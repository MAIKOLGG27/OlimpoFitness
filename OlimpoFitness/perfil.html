<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Olimpo Fitness</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header id="barra-navegacion"></header>
    <script src="scripts/barraNav.js"></script>


    <main class="contenedor-perfil">
        
        <div class="tarjeta-perfil">
            
            <div class="cabecera-perfil">
                <div class="avatar-usuario">
                    <span>OF</span>
                </div>
                <h1 class="nombre-usuario" id="texto-nombre">Vicente Pérez</h1>
                <span class="badge-estado" id="badgeEstado"></span>
            </div>

            <hr class="separador">

            <div class="seccion-datos">
                <h3 class="titulo-seccion">Datos Extra</h3>
                
                <div class="fila-dato">
                    <span class="etiqueta-dato">Correo:</span>
                    <span class="valor-dato" id="texto-correo">vicente.perez@duocuc.cl</span>
                </div>
            </div>

            <hr class="separador">

            <div class="seccion-datos">
                <h3 class="titulo-seccion">Membresía Actual</h3>
                
                <div class="fila-dato">
                    <span class="etiqueta-dato">Plan:</span>
                    <span class="valor-dato plan-resaltado" id="texto-plan">Plan Trimestral</span>
                </div>

                <div class="fila-dato" id="texto-vencimiento-2">
                    <span class="etiqueta-dato">Estado:</span>
                    <span class="valor-dato estado-al-dia" id="texto-estado">Al día</span>
                </div>

                <div class="fila-dato" id="texto-vencimiento">
                    <span class="etiqueta-dato">Vencimiento:</span>
                    <span class="valor-dato">15 de Noviembre, 2026</span>
                </div>
            </div>
            
            <hr class="separador">

            <div class="seccion-datos">
                <h3 class="titulo-seccion">Mis Clases Reservadas</h3>
                
                
                <div id="lista-reservas">
                    
                </div>
            </div>
        </div>

       <script src="scripts/scriptRegistro.js"></script>
    </main>
</body>
</html>
